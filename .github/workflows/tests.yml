# Laeuft bei jedem Push und Pull Request: alle Tests mit Node.
# Keine Abhaengigkeiten, kein npm install, keine Secrets.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/tests.mjs

# Laeuft bei jedem Push und Pull Request: alle Tests mit Node.
# Keine Abhaengigkeiten, kein npm install, keine Secrets.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Actions haengen an Commits, nicht an Tags: ein Tag laesst sich
      # nachtraeglich verschieben, ein Commit nicht. Die Fassung steht als
      # Kommentar daneben; Dependabot aktualisiert beides zusammen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Das Git-Token bleibt nach dem Auschecken nicht im Arbeitsverzeichnis.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node tools/tests.mjs
